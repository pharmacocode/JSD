name: Deploy to Netlify

on:
  push:
    branches:
      - main # Change to 'master' if your main branch uses that name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches npm packages

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Ensures your build script runs locally inside GitHub Actions

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist' # Replace 'dist' with your project's output folder (e.g., 'build' or 'out')
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
