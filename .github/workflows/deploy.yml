name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main

# Least privilege. The deploy step below (wrangler -> Cloudflare Pages) needs
# nothing but the repository contents, so declare the read-only token
# explicitly instead of relying on the repository default. (An older revision
# used nwtgck/actions-netlify, which also tried to post GitHub deployment/commit
# statuses with GITHUB_TOKEN; this repo's read-only default rejected those with
# 403 "Resource not accessible by integration" and they showed up only as log
# noise.)
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Vite inlines VITE_* variables into the bundle at BUILD time, and this
      # workflow (not the static host) runs that build. The host's environment
      # variables are therefore NOT visible here, so the backend URL has to be
      # configured in this GitHub repo:
      #   Settings -> Secrets and variables -> Actions
      # A repository *variable* named VITE_API_BASE_URL is enough (a *secret*
      # with the same name also works as a fallback).
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node-version 22 (current LTS): Vite 6 builds fine on it and
          # wrangler 4 (used by the deploy step below) requires Node >= 18.
          node-version: 22
          cache: 'npm'
          # package-lock.json lives in ./frontend, not at the repo root, so point
          # setup-node's cache lookup at it (otherwise the step fails with
          # "Dependencies lock file is not found in ...").
          cache-dependency-path: './frontend/package-lock.json'

      # Fail fast (and loudly) if the backend URL is not configured: Vite bakes
      # VITE_* values in at build time, so a missing value would silently ship a
      # bundle that points at http://localhost:8000 ("Backend URL not
      # configured" banner in the app).
      - name: Check VITE_API_BASE_URL is configured
        run: |
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error title=VITE_API_BASE_URL is not set::This workflow builds the frontend itself (the static host only receives the finished dist/), so the host's own environment variables are never visible here. Add VITE_API_BASE_URL under GitHub -> Settings -> Secrets and variables -> Actions (a repository Variable is enough; a Secret also works), set it to the Render backend URL, then re-run this workflow."
            exit 1
          fi
          echo "Using backend URL: ${VITE_API_BASE_URL}"

      # NOTE: package.json and package-lock.json live in ./frontend, so run
      # npm ci there instead of at the repo root.
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      # Safety net: the URL must literally appear in the emitted bundle,
      # otherwise Vite did not inline it and the deploy would be broken.
      - name: Verify the backend URL was baked into the bundle
        working-directory: ./frontend
        run: |
          if ! grep -rqF -- "${VITE_API_BASE_URL}" dist; then
            echo "::error::VITE_API_BASE_URL (${VITE_API_BASE_URL}) was not found in frontend/dist, so the build fell back to localhost. Refusing to deploy a broken bundle."
            exit 1
          fi
          echo "OK: frontend/dist references ${VITE_API_BASE_URL}"

      # Deploy with Cloudflare's wrangler CLI to Cloudflare Pages (direct
      # upload). This replaced Netlify on 2026-10-10: Netlify's API started
      # refusing every *production* publish with a bare "Forbidden" caused by an
      # exhausted account credit meter (drafts still returned 200 and the site
      # kept serving), which left the live bundle stale until credits were
      # bought. Cloudflare Pages has no bandwidth/credit meter on the free plan,
      # so that failure class is gone.
      #
      # The build still happens HERE, not on the host, so the two
      # VITE_API_BASE_URL guards above actually run; wrangler only uploads the
      # finished ./frontend/dist. frontend/public/_redirects
      # ("/*    /index.html   200") is copied into dist by Vite and Cloudflare
      # Pages honours that syntax natively, so SPA deep links such as
      # /statusupdate survive a refresh with HTTP 200.
      #
      # Setup (GitHub -> Settings -> Secrets and variables -> Actions):
      #   Secrets:  CLOUDFLARE_API_TOKEN   (Cloudflare -> My Profile -> API
      #                                     Tokens -> Create Custom Token with
      #                                     Account -> Cloudflare Pages -> Edit,
      #                                     i.e. the "Pages Write" scope, and the
      #                                     account listed under Account
      #                                     Resources. A token from the "Edit
      #                                     Cloudflare Workers" template, or one
      #                                     that only got Pages:Read, does NOT
      #                                     work -- see the preflight step above.)
      #             CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard URL, or
      #                                     `npx wrangler whoami`)
      #   Variable: CLOUDFLARE_PAGES_PROJECT (optional, defaults to
      #                                     "jsdbottles")
      # The project itself must exist first (one-time, run locally):
      #   npx wrangler@4 login
      #   npx wrangler@4 pages project create jsdbottles --production-branch=main
      # The <name>.pages.dev hostname is fixed when the project is created: a
      # later rename does not move it, and a name that is already taken gets a
      # suffix (the first project here was "jsd" -> jsd-dt0.pages.dev).
      # Recreating it as "jsdbottles" produced https://jsdbottles.pages.dev.
      #
      # FAILURE MODES:
      #   - "Authentication error" / code 10000 -> the token is wrong, expired,
      #     or lacks the Pages Write ("Cloudflare Pages: Edit") permission. The
      #     preflight step above catches this first and says so in plain words.
      #   - "project not found" -> CLOUDFLARE_PAGES_PROJECT typo, or the token
      #     belongs to a different account than CLOUDFLARE_ACCOUNT_ID.
      #
      # Preflight for the deploy below. wrangler's very first Pages API call is
      #   GET /accounts/<id>/pages/projects/<project>/upload-token
      # (it asks Cloudflare for a short-lived JWT to upload assets with). That
      # endpoint accepts exactly one permission - the account-scoped "Pages
      # Write" scope, labelled "Cloudflare Pages: Edit" in the dashboard - and a
      # token without it (e.g. one made from the "Edit Cloudflare Workers"
      # template, or a custom token that only got Pages:Read) is refused with
      # the opaque "Authentication error [code: 10000]", which names neither the
      # missing scope nor the account. Probe the same endpoint here first so the
      # log shows the API's own error plus the remedy.
      - name: Check Cloudflare credentials can deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'jsdbottles' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Cloudflare credentials missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Secrets under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          body=$(mktemp)
          status=$(curl -sS -o "${body}" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/upload-token") || status=000
          if [ "${status}" != "200" ]; then
            echo "Cloudflare answered HTTP ${status} for ${CLOUDFLARE_PAGES_PROJECT}'s upload token:"
            cat "${body}"
            echo "::error title=CLOUDFLARE_API_TOKEN cannot deploy to Pages::The API refused the upload-token request printed above. Create a Custom Token with Account / Cloudflare Pages / Edit (the 'Pages Write' scope), include this account under Account Resources, replace the CLOUDFLARE_API_TOKEN secret with it, and check that CLOUDFLARE_ACCOUNT_ID is that same account, then re-run this workflow. Meanwhile npx wrangler@4 login followed by npx wrangler@4 pages deploy dist --branch=main inside frontend/ deploys from your own machine."
            exit 1
          fi
          echo "OK: the token may request an upload token for ${CLOUDFLARE_PAGES_PROJECT}."
      - name: Deploy to Cloudflare Pages
        working-directory: ./frontend
        env:
          # Read from the environment so the token never appears on a command
          # line (and never shows up in the logs).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'jsdbottles' }}
          # Keep CI non-interactive: no telemetry or update prompts.
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Cloudflare credentials missing::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Secrets under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name="${CLOUDFLARE_PAGES_PROJECT}" \
            --branch=main \
            --commit-dirty=true
