name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # NOTE: If your package.json is inside a subfolder, change 'jsd-group-frontend' to match your folder name
      - name: Install dependencies
        working-directory: ./jsd-group/frontend
        run: npm ci

      - name: Build project
        working-directory: ./jsd-group/frontend
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './jsd-group/frontend/dist' # Points to the build output inside your frontend folder
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
