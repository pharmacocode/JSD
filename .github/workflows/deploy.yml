name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - main

# Least privilege. Note that the previously used deploy action (see the
# "Deploy to Netlify" step) tried to post GitHub deployments/commit statuses
# with GITHUB_TOKEN; this repo defaults to a read-only token, so those calls
# were silently rejected (403 "Resource not accessible by integration") and
# logged only as noise. The CLI-based deploy below needs nothing but the repo
# contents, so keep the token read-only.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Vite inlines VITE_* variables into the bundle at BUILD time, and this
      # workflow (not Netlify) now runs that build. Netlify's site environment
      # variables are therefore NOT visible here, so the backend URL has to be
      # configured in this GitHub repo:
      #   Settings -> Secrets and variables -> Actions
      # A repository *variable* named VITE_API_BASE_URL is enough (a *secret*
      # with the same name also works as a fallback).
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node-version 22 because netlify-cli 27 (used by the deploy step
          # below) requires Node >= 22.13. Vite 5 builds fine on Node 22.
          node-version: 22
          cache: 'npm'
          # package-lock.json lives in ./frontend, not at the repo root, so point
          # setup-node's cache lookup at it (otherwise the step fails with
          # "Dependencies lock file is not found in ...").
          cache-dependency-path: './frontend/package-lock.json'

      # Fail fast (and loudly) if the backend URL is not configured: Vite bakes
      # VITE_* values in at build time, so a missing value would silently ship a
      # bundle that points at http://localhost:8000 ("Backend URL not
      # configured" banner in the app).
      - name: Check VITE_API_BASE_URL is configured
        run: |
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error title=VITE_API_BASE_URL is not set::This workflow now builds the frontend (Netlify no longer does), so Netlify's environment variables are not visible here. Add VITE_API_BASE_URL under GitHub -> Settings -> Secrets and variables -> Actions (a repository Variable is enough; a Secret also works), set it to the Render backend URL, then re-run this workflow."
            exit 1
          fi
          echo "Using backend URL: ${VITE_API_BASE_URL}"

      # NOTE: package.json and package-lock.json live in ./frontend, so run
      # npm ci there instead of at the repo root.
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      # Safety net: the URL must literally appear in the emitted bundle,
      # otherwise Vite did not inline it and the deploy would be broken.
      - name: Verify the backend URL was baked into the bundle
        working-directory: ./frontend
        run: |
          if ! grep -rqF -- "${VITE_API_BASE_URL}" dist; then
            echo "::error::VITE_API_BASE_URL (${VITE_API_BASE_URL}) was not found in frontend/dist, so the build fell back to localhost. Refusing to deploy a broken bundle."
            exit 1
          fi
          echo "OK: frontend/dist references ${VITE_API_BASE_URL}"

      # Deploy with Netlify's own CLI instead of nwtgck/actions-netlify.
      #
      # That action (v3.0) started failing every run with a bare "Forbidden"
      # raised by the old Netlify client bundled inside it, before any deploy
      # happened. The credentials and the Netlify side were verified healthy
      # (Sites API reads 200, deploy creation 200, and this same CLI deploys
      # this same site successfully), so the unmaintained action bundle was the
      # problem. The CLI is Netlify's supported path, so use it directly.
      #
      # working-directory ./frontend means the CLI picks up frontend/netlify.toml
      # (publish = "dist") and its `_redirects` file (shipped via frontend/public)
      # still provides the SPA history fallback.
      - name: Deploy to Netlify
        working-directory: ./frontend
        env:
          # The CLI reads the token from the environment, so it is never placed
          # on a command line (and never printed in the logs).
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli@27 --no-fund --no-audit
          netlify --version
          netlify deploy \
            --prod \
            --dir=dist \
            --site "${NETLIFY_SITE_ID}" \
            --message "GitHub Actions ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
